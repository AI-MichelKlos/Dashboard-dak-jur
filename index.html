      if (range==='from2022') { const f=filterFrom2022(labels, arrays); labels=f.labels; arrays=f.arrs; }
      if (!hasSeries(labels, arrays)) return showEmpty(obj);
      const ds=names.map((n,i)=>({label:n, data:arrays[i], borderColor:colors[i%colors.length], backgroundColor:colors[i%colors.length]+'33', tension:.25, pointRadius:2}));
      drawLine(obj.id, labels, ds, {yTitle:'Antal'});
    } redraw();
  }
  function barSeries(topic, title, labels0, vals0, source, note) {
    const obj=makeCard(topic, title, note, source);
    let range='from2022'; addRangeControls(obj.controls, r=>{ range=r; redraw(); });
    function redraw() {
      let labels=labels0, vals=vals0;
      if (range==='from2022') { const f=filterFrom2022(labels,[vals]); labels=f.labels; vals=f.arrs[0]; }
      if (!hasSeries(labels,[vals])) return showEmpty(obj);
      drawLine(obj.id, labels, [{label:title, data:vals, backgroundColor:'#6B9E78'}], {type:'bar', yTitle:'Antal'});
    } redraw();
  }
  function stackedWorkSharing(topic, section) {
    const obj=makeCard(topic, section.title, 'Stablede søjler opdelt på arbejdsfordelinger op til 13 uger og ud over 13 uger.', section.source);
    let range='from2022'; addRangeControls(obj.controls, r=>{range=r; redraw();});
    function redraw() {
      let labels=section.labels, a=section.under13Weeks, b=section.over13Weeks;
      if (range==='from2022') { const f=filterFrom2022(labels,[a,b]); labels=f.labels; a=f.arrs[0]; b=f.arrs[1]; }
      if (!hasSeries(labels,[a,b])) return showEmpty(obj);
      destroy(obj.id);
      charts[obj.id]=new Chart(document.getElementById(obj.id), {type:'bar', data:{labels, datasets:[{label:'Op til 13 uger', data:a, backgroundColor:'#6B9E78'},{label:'Ud over 13 uger', data:b, backgroundColor:'#E07A40'}]}, options:{responsive:true, maintainAspectRatio:false, layout:{padding:{top:24,right:18,bottom:10,left:12}}, plugins:commonPlugins(true), scales:{x:Object.assign(xAxis(labels),{stacked:true}), y:Object.assign(yAxis('Antal'),{stacked:true})}}});
    } redraw();
  }
  function failedRecruitment(topic, section) {
    const obj=makeCard(topic, 'Udvikling i rekrutteringer og forgæves rekrutteringsrate', section.rightAxisNote, section.source);
    let range='from2022'; addRangeControls(obj.controls, r=>{range=r; redraw();});
    function redraw() {
      const names=['Succesfulde rekrutteringer','Ikke besatte rekrutteringer','Substituerede rekrutteringer','Forgæves rekrutteringsrate (FRR)','FRR uden substitution'];
      let labels=section.labels, arrays=names.map(n=>section.series[n]||[]);
      if (range==='from2022') { const f=filterFrom2022(labels,arrays); labels=f.labels; arrays=f.arrs; }
      if (!hasSeries(labels, arrays)) return showEmpty(obj);
      const ds=[
        {label:'Succesfulde rekrutteringer', data:arrays[0], borderColor:colors[0], backgroundColor:colors[0]+'33', yAxisID:'y', tension:.25, pointRadius:2},
        {label:'Ikke besatte rekrutteringer', data:arrays[1], borderColor:colors[1], backgroundColor:colors[1]+'33', yAxisID:'y', tension:.25, pointRadius:2},
        {label:'Substituerede rekrutteringer', data:arrays[2], borderColor:colors[2], backgroundColor:colors[2]+'33', yAxisID:'y', tension:.25, pointRadius:2},
        {label:'FRR, højre akse', data:arrays[3], borderColor:colors[3], backgroundColor:colors[3]+'33', yAxisID:'y1', tension:.25, pointRadius:2},
        {label:'FRR uden substitution, højre akse', data:arrays[4], borderColor:colors[4], backgroundColor:colors[4]+'33', yAxisID:'y1', tension:.25, pointRadius:2}
      ];
      drawLine(obj.id, labels, ds, {scales:{x:xAxis(labels), y:yAxis('Antal'), y1:{position:'right', beginAtZero:true, title:{display:true,text:section.rightAxisLabel}, ticks:{callback:v=>fmtDec.format(Number(v)*100)+'%'}, grid:{drawOnChartArea:false} } }});
    } redraw();
    const top=makeCard(topic, '15 stillinger med flest forgæves rekrutteringsforsøg', 'Seneste opgørelse i filen. Søjlerne viser ikke besatte rekrutteringer efter stilling.', section.source, {tall:true});
    const labels=section.topOccupations.map(x=>x.label); const vals=section.topOccupations.map(x=>x.value);
    if (!hasSeries(labels,[vals])) showEmpty(top); else {
      charts[top.id]=new Chart(document.getElementById(top.id), {type:'bar', data:{labels, datasets:[{label:'Ikke besatte rekrutteringer', data:vals, backgroundColor:'#6B9E78'}]}, options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, layout:{padding:{top:24,right:22,bottom:10,left:26}}, plugins:commonPlugins(false), scales:{x:yAxis('Antal'), y:{ticks:{autoSkip:false, padding:14, font:{size:11}, callback:function(v){ const lbl=this.getLabelForValue(v); return lbl.length>44 ? lbl.slice(0,42)+'...' : lbl; }}, grid:{display:false}}}}});
    }
  }
  function sanctions(topic, section) {
    const obj=makeCard(topic, 'Antal sanktioner fordelt på type', 'Grafen viser antal sanktioner i alt og de tilgængelige sanktionstyper. Standardvisningen er alle a-kasser.', section.source);
    let range='from2022', selected='__total__';
    addAkasseSelect(obj.controls, section.byAkasse.shareSanctioned, v=>{selected=v; redraw();});
    addRangeControls(obj.controls, r=>{range=r; redraw();});
    function redraw() {
      const names=Object.keys(section.sanctionTypes || {});
      let labels=section.labels;
      let arrays=names.map(n => selected==='__total__' ? section.sanctionTypes[n] : (section.byAkasse.sanctionTypes[n]||{})[selected]);
      if (range==='from2022') { const f=filterFrom2022(labels,arrays); labels=f.labels; arrays=f.arrs; }
      if (!hasSeries(labels,arrays)) return showEmpty(obj);
      const ds=names.map((n,i)=>({label:n, data:arrays[i], borderColor:colors[i%colors.length], backgroundColor:colors[i%colors.length]+'33', tension:.25, pointRadius:2}));
      drawLine(obj.id, labels, ds, {yTitle:'Antal'});
    } redraw();
    const share=makeCard(topic, 'Andel sanktionerede ledige', 'Andelen kan vælges for alle a-kasser eller for den enkelte a-kasse.', section.source);
    let range2='from2022', selected2='__total__';
    addAkasseSelect(share.controls, section.byAkasse.shareSanctioned, v=>{selected2=v; redrawShare();});
    addRangeControls(share.controls, r=>{range2=r; redrawShare();});
    function redrawShare() {
      let labels=section.labels, vals= selected2==='__total__' ? section.shareSanctioned : section.byAkasse.shareSanctioned[selected2];
      // andel in file is percentage points, convert to decimal for chart formatting
      vals=(vals||[]).map(v=>v===null || v===undefined ? null : Number(v)/100);
      if (range2==='from2022') { const f=filterFrom2022(labels,[vals]); labels=f.labels; vals=f.arrs[0]; }
      if (!hasSeries(labels,[vals])) return showEmpty(share);
      drawLine(share.id, labels, [{label:selected2==='__total__'?'Alle a-kasser':selected2, data:vals, borderColor:colors[0], backgroundColor:colors[0]+'33', tension:.25, pointRadius:2}], {pct:true, yTitle:'Andel'});
    } redrawShare();
  }

  document.getElementById('versionDate').textContent = DATA.meta.versionDate;
  const grid=document.getElementById('kpiGrid');
  grid.append(
    renderKpiCard('Ledighed i a-kasserne', DATA.sections.unemploymentAkasser.kpi),
    renderKpiCard('Langtidsledighed', DATA.sections.longTermUnemployment.kpi),
    renderKpiCard('Aktiveringstilbud', DATA.sections.activationOffers.kpi),
    renderCombinedNoticeBankruptcy(),
    renderKpiCard('Arbejdsfordelinger, både under og over 13 uger', DATA.sections.workSharing.kpi),
    renderKpiCard('Forgæves rekrutteringsforsøg', DATA.sections.failedRecruitment.kpi),
    renderKpiCard('Dimittendledige dagpengemodtagere', DATA.sections.graduateUnemployed.kpi),
    renderKpiCard('Dimittender med opbrugt dagpengeret', DATA.sections.graduateExpiredBenefits.kpi),
    renderKpiCard('Sanktioner', DATA.sections.sanctions.kpi)
  );
  let t;
  t=makeTopic(DATA.sections.unemploymentAkasser.title); timeSeriesWithAkasse(t, DATA.sections.unemploymentAkasser, 'Antal fuldtidsledige');
  t=makeTopic(DATA.sections.longTermUnemployment.title); timeSeriesWithAkasse(t, DATA.sections.longTermUnemployment, 'Antal langtidsledige fuldtidspersoner');
  t=makeTopic(DATA.sections.activationOffers.title); multiSeries(t, DATA.sections.activationOffers, 'Aktiveringstilbud fordelt på tilbudstype', 'Grafen viser udviklingen i aktiveringstilbud i alt og opdelt på tilbudstyper.');
  t=makeTopic(DATA.sections.noticesAndBankruptcies.title); barSeries(t, 'Varslede afskedigelser', DATA.sections.noticesAndBankruptcies.notices.labels, DATA.sections.noticesAndBankruptcies.notices.total, DATA.sections.noticesAndBankruptcies.notices.source, 'Søjlerne viser varslede afskedigelser målt som antal personer.'); barSeries(t, 'Konkurser', DATA.sections.noticesAndBankruptcies.bankruptcies.labels, DATA.sections.noticesAndBankruptcies.bankruptcies.total, DATA.sections.noticesAndBankruptcies.bankruptcies.source, 'Søjlerne viser konkurser i virksomheder med beskæftigelse.');
  t=makeTopic(DATA.sections.workSharing.title); stackedWorkSharing(t, DATA.sections.workSharing);
  t=makeTopic(DATA.sections.failedRecruitment.title); failedRecruitment(t, DATA.sections.failedRecruitment);
  t=makeTopic(DATA.sections.graduateUnemployed.title); timeSeriesWithAkasse(t, DATA.sections.graduateUnemployed, 'Antal dimittendledige fuldtidspersoner');
  t=makeTopic(DATA.sections.graduateExpiredBenefits.title); multiSeries(t, DATA.sections.graduateExpiredBenefits, 'Dimittender med opbrugt dagpengeret', 'Grafen viser ledige i alt og opdeling på 1 års dimittendret, øvrige dimittender og øvrige ledige, hvor serien findes i data.');
  t=makeTopic(DATA.sections.sanctions.title); sanctions(t, DATA.sections.sanctions);
})();
</script>
