name: Omdøb JUR-dashboard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-jur-dashboard.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ret dashboardtitel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'Nøgletal for a-kasserne'
          new = 'JUR – Arbejdsmarkedsoverblik'
          count = text.count(old)
          if count != 2:
              raise RuntimeError(f'Forventede 2 forekomster af gammel titel, fandt {count}')
          text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Kontroller titel
        shell: bash
        run: |
          grep -Fq '<title>JUR – Arbejdsmarkedsoverblik</title>' index.html
          grep -Fq '<h1>JUR – Arbejdsmarkedsoverblik</h1>' index.html
          ! grep -Fq 'Nøgletal for a-kasserne' index.html
      - name: Gem ændringen
        shell: bash
        run: |
          git config user.name "ChatGPT dashboard update"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html
          git commit -m "Omdøb dashboard til JUR – Arbejdsmarkedsoverblik"
          git push origin HEAD:main
