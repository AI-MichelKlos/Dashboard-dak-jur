name: Tilføj grafikcredit og kontakt

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/contact-credit-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tilfoej credit og kontakt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('Grafik og databehandling: Danske A-kasser', 'Grafik og databehandling: Michel Klos')
          footer = '<div style="margin-top:24px;color:var(--muted);font-size:.8rem;text-align:center">Grafik og databehandling: Michel Klos · Kontakt: <a href="mailto:mk@danskeakasser.dk" style="color:var(--dark-green)">mk@danskeakasser.dk</a></div>'
          if 'mailto:mk@danskeakasser.dk' not in text:
              if '</main>' not in text:
                  raise RuntimeError('Kan ikke finde </main>')
              text = text.replace('</main>', footer + '\n  </main>', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Kontroller
        shell: bash
        run: |
          grep -Fq 'Grafik og databehandling: Michel Klos' index.html
          grep -Fq 'mailto:mk@danskeakasser.dk' index.html
          ! grep -Fq 'Grafik og databehandling: Danske A-kasser' index.html
      - name: Gem
        shell: bash
        run: |
          git config user.name "ChatGPT dashboard update"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html
          git commit -m "Tilføj grafikcredit og kontakt"
          git push origin HEAD:main
