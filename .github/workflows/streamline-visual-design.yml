name: Engangsopdatering af dashboarddesign

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/streamline-visual-design.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Strømlin design og byline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text
          hero_css = """<style>\nbody{margin:0;background:#f5f7f5;font-family:'Segoe UI',Arial,sans-serif;color:#0F2B36}\n.dak-hero{background:linear-gradient(135deg,#0F2B36,#244d4b);color:#fff;padding:32px 20px}\n.dak-hero-inner{max-width:1280px;margin:0 auto}\n.dak-eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#c9dfcf}\n.dak-hero h1{font-size:clamp(2.1rem,4vw,3.4rem);line-height:1.08;margin:5px 0 0;color:#fff;letter-spacing:-.025em}\n.dak-hero .dashboard-subtitle{margin:5px 0 0;color:#c9d8d5;font-size:.78rem;font-weight:600}\n"""
          if '<style>\n#dak-analyse-jur{' not in text:
              raise RuntimeError('Kunne ikke finde JUR-dashboardets stylesheet')
          text = text.replace('<style>\n#dak-analyse-jur{', hero_css + '#dak-analyse-jur{', 1)
          text = text.replace('--soft:#F5F8F5', '--soft:#f5f7f5')
          text = text.replace('background:rgba(255,255,255,.96)', 'background:rgba(245,247,245,.96)')
          text = text.replace('border:1px solid #dce6dd', 'border:1px solid var(--grid)')
          text = text.replace('border:1px solid #cfdacf', 'border:1px solid #d6dfd9')
          old_head = '''<body>\n<div id="dak-analyse-jur">\n  <header class="dashboard-header">\n    <h1>Nøgletal for a-kasserne</h1>\n    <p class="dashboard-subtitle">Udarbejdet af Danske A-kasser</p>\n  </header>'''
          new_head = '''<body>\n<header class="dak-hero"><div class="dak-hero-inner"><div class="dak-eyebrow">Danske A-kasser</div><h1>Nøgletal for a-kasserne</h1><p class="dashboard-subtitle">Udarbejdet af Michel Klos@GitHub</p></div></header>\n<div id="dak-analyse-jur">'''
          if old_head not in text:
              raise RuntimeError('Kunne ikke finde JUR-dashboardets nuværende top')
          text = text.replace(old_head, new_head, 1)
          if text == original or 'Udarbejdet af Michel Klos@GitHub' not in text or 'linear-gradient(135deg,#0F2B36,#244d4b)' not in text:
              raise RuntimeError('Designændringen blev ikke anvendt')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Kontroller ændringen
        shell: bash
        run: |
          grep -Fq 'Udarbejdet af Michel Klos@GitHub' index.html
          grep -Fq 'linear-gradient(135deg,#0F2B36,#244d4b)' index.html
          grep -Fq 'const DATA=' index.html
          grep -Fq 'const C=' index.html
      - name: Gem ændringen og fjern engangsworkflow
        shell: bash
        run: |
          rm .github/workflows/streamline-visual-design.yml
          git config user.name "ChatGPT design update"
          git config user.email "dashboard-automation@users.noreply.github.com"
          git add index.html .github/workflows/streamline-visual-design.yml
          git commit -m "Strømlin dashboarddesign og tilføj byline"
          git push origin HEAD:main
