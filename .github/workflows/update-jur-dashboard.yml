name: Update JUR dashboard
run-name: "JUR-dashboard – ${{ github.event_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_jur_dashboard.py"
      - "scripts/run_jur_update.py"
      - ".github/workflows/update-jur-dashboard.yml"
  schedule:
    - cron: "15 7 * * 1-5"
    - cron: "15 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-jur-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - name: Afgør om den planlagte kørsel skal fortsætte
        id: localtime
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_time="$(TZ=Europe/Copenhagen date +'%Y-%m-%d %H:%M %Z')"
          local_hour="$(TZ=Europe/Copenhagen date +'%H')"
          echo "Lokal tid i København: $local_time"

          if [ "$local_hour" = "09" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Springer over: den anden UTC-plan rammer ikke kl. 09 dansk tid."
          fi

      - uses: actions/checkout@v4
        if: steps.localtime.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.localtime.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - name: Kør JUR-opdatering og gem status
        if: steps.localtime.outputs.should_run == 'true'
        id: update
        shell: bash
        run: |
          mkdir -p status
          started="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ -z "$JOBINDSATS_API_TOKEN" ]; then
            printf 'status: fejl\ntid_utc: %s\ntrin: secret\nfejl: API_ADGANG mangler eller er tomt\n' "$started" > status/last-run.txt
            echo "API_ADGANG mangler eller er tomt."
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            set +e
            python -m py_compile scripts/update_jur_dashboard.py scripts/run_jur_update.py > status/run.log 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              code=1
              for attempt in 1 2 3; do
                echo "Forsøg $attempt af 3" | tee -a status/run.log
                python scripts/run_jur_update.py >> status/run.log 2>&1
                code=$?
                if [ "$code" -eq 0 ]; then
                  break
                fi
                if [ "$attempt" -lt 3 ]; then
                  pause=$((attempt * 45))
                  echo "Opdateringen fejlede. Prøver igen om $pause sekunder." | tee -a status/run.log
                  sleep "$pause"
                fi
              done
            fi
            set -e
            cat status/run.log || true
            if [ "$code" -eq 0 ]; then
              printf 'status: ok\ntid_utc: %s\n' "$started" > status/last-run.txt
            else
              message="$(tail -n 12 status/run.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
              printf 'status: fejl\ntid_utc: %s\ntrin: opdatering\nfejl: %s\n' "$started" "$message" > status/last-run.txt
            fi
            echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          fi

      - name: Kontroller dashboardfilen
        if: steps.localtime.outputs.should_run == 'true' && steps.update.outputs.exit_code == '0'
        run: |
          test -s index.html
          test -s data/dashboard-data.json
          grep -q "Nøgletal for a-kasserne" index.html
          grep -q "const DATA=" index.html

      - name: Gem data og status
        if: steps.localtime.outputs.should_run == 'true' && always()
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Ingen ændringer at gemme."
          else
            git config user.name "JUR dashboard automation"
            git config user.email "jur-dashboard-automation@users.noreply.github.com"
            git commit -m "Opdater JUR-dashboardstatus"
            git push
          fi

      - name: Markér mislykket kørsel
        if: steps.localtime.outputs.should_run == 'true' && steps.update.outputs.exit_code != '0'
        run: exit 1
