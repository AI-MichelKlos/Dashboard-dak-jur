name: Update JUR dashboard
run-name: "JUR-dashboard - ${{ github.event_name }}"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_jur_dashboard.py"
      - "scripts/run_jur_update.py"
      - "scripts/update_dst_unemployment_percent.py"
      - "scripts/refresh_dst_sources.py"
      - ".github/workflows/update-jur-dashboard.yml"
  schedule:
    # Flere backupforsøg, fordi GitHub kan forsinke eller droppe enkelte cron-kørsler.
    # Dagslåsen nedenfor sikrer, at der kun gennemføres én vellykket opdatering pr. dag.
    - cron: "23 7-11 * * *"

permissions:
  contents: write

concurrency:
  group: update-jur-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Afgør om opdateringen skal gennemføres
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Kører, fordi hændelsen er ${{ github.event_name }}."
            exit 0
          fi

          today="$(TZ=Europe/Copenhagen date +'%F')"
          local_hour="$(TZ=Europe/Copenhagen date +'%H')"
          local_hour=$((10#$local_hour))
          echo "Dansk dato: $today"
          echo "Dansk time: $local_hour"

          if [ "$local_hour" -lt 9 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Springer over: backupforsøget ligger før kl. 09 dansk tid."
          elif grep -Fxq "status: ok" status/last-run.txt 2>/dev/null && \
               grep -Fxq "dato_dk: $today" status/last-run.txt 2>/dev/null; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Springer over: dashboardet er allerede opdateret i dag."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Kører dagens opdatering eller et backupforsøg efter en tidligere fejl."
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.12"

      - name: Reparer kendt AUP03-historikfejl
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/dashboard-data.json').read_text(encoding='utf-8'))
          values = data['sections']['unemploymentPercent']['byAkasse']['Akademikernes A-kasse']
          raise SystemExit(0 if len(values) >= 10 and all(v == 0 for v in values[:10]) else 1)
          PY
          then
            echo "Genopretter seneste kendte korrekte historik før AUP03-opdatering."
            git checkout e6df04fc4683ce5154c0fd032b22306435ed33ec -- data/dashboard-data.json index.html
          else
            echo "Ingen historikreparation nødvendig."
          fi

      - name: Kør JUR-opdatering og gem status
        if: steps.gate.outputs.should_run == 'true'
        id: update
        shell: bash
        run: |
          mkdir -p status
          started="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          today="$(TZ=Europe/Copenhagen date +'%F')"
          if [ -z "$JOBINDSATS_API_TOKEN" ]; then
            printf 'status: fejl\ntid_utc: %s\ndato_dk: %s\ntrin: secret\nfejl: API_ADGANG mangler eller er tomt\n' "$started" "$today" > status/last-run.txt
            echo "API_ADGANG mangler eller er tomt."
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            set +e
            python -m py_compile scripts/update_jur_dashboard.py scripts/run_jur_update.py scripts/update_dst_unemployment_percent.py scripts/refresh_dst_sources.py > status/run.log 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              python scripts/run_jur_update.py >> status/run.log 2>&1
              code=$?
            fi
            if [ "$code" -eq 0 ]; then
              python scripts/refresh_dst_sources.py >> status/run.log 2>&1
              code=$?
            fi
            set -e
            cat status/run.log || true
            if [ "$code" -eq 0 ]; then
              printf 'status: ok\ntid_utc: %s\ndato_dk: %s\n' "$started" "$today" > status/last-run.txt
            else
              message="$(tail -n 12 status/run.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
              printf 'status: fejl\ntid_utc: %s\ndato_dk: %s\ntrin: opdatering\nfejl: %s\n' "$started" "$today" "$message" > status/last-run.txt
            fi
            echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          fi

      - name: Kontroller dashboardfilen
        if: steps.gate.outputs.should_run == 'true' && steps.update.outputs.exit_code == '0'
        run: |
          test -s index.html
          test -s data/dashboard-data.json
          grep -q "Nøgletal for a-kasserne" index.html
          grep -q "const DATA=" index.html
          grep -q '"AUP03"' data/dashboard-data.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/dashboard-data.json').read_text(encoding='utf-8'))
          sec = data['sections']['unemploymentPercent']
          assert sec['labels'][-1] == data['meta']['sourceStatus']['AUP03']['latestPeriod']
          assert sec['total'][-1] is not None
          assert all(values[-1] is not None for values in sec['byAkasse'].values())
          PY

      - name: Gem data og status
        if: steps.gate.outputs.should_run == 'true' && always()
        run: |
          git add index.html data/dashboard-data.json status/last-run.txt
          if git diff --cached --quiet; then
            echo "Ingen ændringer at gemme."
          else
            git config user.name "JUR dashboard automation"
            git config user.email "jur-dashboard-automation@users.noreply.github.com"
            git commit -m "Opdater JUR-dashboarddata og status"
            git push
          fi

      - name: Markér mislykket kørsel
        if: steps.gate.outputs.should_run == 'true' && steps.update.outputs.exit_code != '0'
        run: exit 1
