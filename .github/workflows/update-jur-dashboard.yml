name: Update JUR dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - agent/automate-jur-dashboard
    paths:
      - "scripts/update_jur_dashboard.py"
      - ".github/workflows/update-jur-dashboard.yml"
  schedule:
    - cron: "15 9 * * 1-5"
      timezone: "Europe/Copenhagen"

permissions:
  contents: write

concurrency:
  group: update-jur-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOBINDSATS_API_TOKEN: ${{ secrets.API_ADGANG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kontroller Jobindsats-secret
        run: |
          if [ -z "$JOBINDSATS_API_TOKEN" ]; then
            echo "Secretet API_ADGANG mangler eller er tomt."
            exit 1
          fi
      - name: Kør og registrer testen
        run: |
          mkdir -p data
          set +e
          python scripts/update_jur_dashboard.py > data/update-test.log 2>&1
          status=$?
          echo "$status" > data/update-exit-code.txt
          cat data/update-test.log
          exit 0
      - name: Gem testresultat
        run: |
          git add index.html data/dashboard-data.json data/update-test.log data/update-exit-code.txt
          git config user.name "JUR dashboard automation"
          git config user.email "jur-dashboard-automation@users.noreply.github.com"
          git commit -m "Gem resultat af JUR-opdateringstest"
          git push
